name: Actualisation Quotidienne Veille SISR

on:
  schedule:
    - cron: '0 6 * * *'  # Exécution automatique tous les jours à 6h UTC
  workflow_dispatch:      # Permet aussi de déclencher manuellement via le bouton GitHub

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécution de l'agrégateur
        run: python update_veille.py

      - name: Commit et Push automatique
        run: |
          git config --global user.name "SISR-Bot"
          git config --global user.email "bot@estiam.com"
          git add veille.json
          git commit -m "Auto-veille : actualisation quotidienne" || exit 0
          git push
          